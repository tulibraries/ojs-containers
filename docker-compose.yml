services:
  db:
    image: ${DB_VERSION:-mariadb:11.8}
    env_file:
      - .env
    container_name: "pkp_db_${COMPOSE_PROJECT_NAME:-demo}"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-changeMePlease}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-pkp}"
      MYSQL_USER: "${MYSQL_USER:-pkp}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-changeMePlease}"
    volumes:
      # Persistent database mounts remain optional.
      # - ./volumes/db:/var/lib/mysql
      # - ./volumes/logs/db:/var/log/mysql
      # - ./volumes/config/db.charset.conf:/etc/mysql/conf.d/charset.cnf
      # Initialization scripts run only for a new MariaDB data directory.
      - ./${DB_DUMP_FILE:-dump.sql}:/docker-entrypoint-initdb.d/01-db-dump.sql:ro
    networks:
      - inside
    restart: unless-stopped

  app:
    image: ${IMAGE_SOURCE:-local}/${PKP_TOOL:-omp}:${PKP_VERSION:-3_3_0-20}
    build: 
      context: .
      dockerfile: Dockerfile
      args:
        # Modify .env to change this arguments
        PKP_TOOL: ${PKP_TOOL:-omp}
        PKP_VERSION: ${PKP_VERSION}
        WEB_SERVER: ${WEB_SERVER}
        WEB_PATH: ${WEB_PATH}
        BUILD_PKP_APP_OS: ${BUILD_PKP_APP_OS}
    env_file:
      - .env
    container_name: "pkp_app_${COMPOSE_PROJECT_NAME:-demo}"
    hostname: "${COMPOSE_PROJECT_NAME:-demo}"
    ports:
      - ${HTTP_PORT:-8081}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      # Keep host and container sync:
      - /etc/localtime:/etc/localtime
      - ./volumes/private:/var/files
      - ./volumes/plugins:/var/www/html/ojs/plugins
      - ./volumes/public:/var/www/html/ojs/public
      - ${OJS_CONFIG_FILE:-./volumes/config/pkp.config.inc.php}:/var/www/html/ojs/config.inc.php
#      - ./volumes/private:/var/www/files
#      - ./volumes/public:/var/www/html/ojs/public
#      - ./volumes/logs/app:/var/log/apache2
#      # WARNING: You can only enable file-volumes if file exists in the container.
#      - ./volumes/config/pkp.config.inc.php:/var/www/html/ojs/config.inc.php
#      - ./volumes/config/apache.htaccess:/var/www/html/ojs/.htaccess
      - ./volumes/config/php.custom.ini:/etc/php85/conf.d/custom.ini

    networks:
      - inside
    depends_on:
      - db
    restart: unless-stopped

networks:
  inside:
    external: false
